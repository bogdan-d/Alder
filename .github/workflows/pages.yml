name: Publish Alder website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'docs/home-dune.png'
      - 'docs/title.png'
      - 'docs/sources.jpg'
      - 'docs/tracks.jpg'
      - 'docs/picker.jpg'
      - 'branding/house-lights/alder_mark.svg'
      - 'branding/house-lights/alder_portfolio_card_product.webp'
      - 'app/src/main/assets/fonts/inter.ttf'
      - 'app/src/main/assets/fonts/instrument_serif.ttf'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
